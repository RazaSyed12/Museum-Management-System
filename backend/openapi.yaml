  /membership/purchase:
    post:
      summary: Buy a membership plan
      description: 'Starts buying a plan. The membership is created as pending and only becomes active when its payment is settled. With the simulated provider the payment is confirmed straight away (add {"confirm": false} to stop after starting it and finish later with POST /payments/{id}/confirm, and {"simulate": "card_declined"} to simulate a failure). With a real provider the reply carries next_action telling the customer where to go. Safe to repeat: an unfinished purchase of the same plan is reused. A free plan (price 0) is active at once and answers 201.'
      operationId: purchaseMembership
      tags:
        - Membership
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseMembershipRequest'
      responses:
        '200':
          description: Paid; the membership is active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentOutcomeResponse'
        '201':
          description: 'A free plan: the membership is active at once'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentOutcomeResponse'
        '202':
          description: The payment was started but is not settled yet; follow next_action
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentPendingResponse'
        '400':
          description: Validation failed
          content:
