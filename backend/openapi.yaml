                $ref: '#/components/schemas/ErrorResponse'
  /admin/users:
    get:
      summary: List users
      description: Admin tier only. Newest first.
      operationId: listUsers
      tags:
        - Admin
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          schema:
            type: string
            maxLength: 100
          description: Name or email contains this text
        - name: role
          in: query
          schema:
            type: string
            enum:
              - registered
              - member
              - staff
        - name: status
          in: query
          schema:
            type: string
            enum:
              - active
              - suspended
              - deleted
        - name: tier
          in: query
          description: Admin/Manager/Staff portal tier
          schema:
            type: string
            enum:
              - admin
              - manager
              - staff
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Page size
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
          description: How many rows to skip
      responses:
        '200':
          description: A page of users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserListResponse'
        '400':
          description: Invalid query parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing, invalid or expired access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The signed-in user does not have an admin tier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Database error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/users/{id}:
    get:
      summary: Get one user
      description: Admin tier only. The user with their current membership and 10 most recent bookings.
      operationId: getUser
      tags:
        - Admin
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The user's id
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserResponse'
        '401':
          description: Missing, invalid or expired access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The signed-in user is not staff
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Database error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      summary: Change a user's role, status or tier
      description: >-
        Admin tier only. Send role, status, tier, or some combination.
        Suspending a user ends all of their sessions. An admin cannot change
        their own role/status/tier, and the last active admin can never be
        demoted, suspended, or re-tiered away from admin — by anyone.
      operationId: updateUser
      tags:
        - Admin
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The user's id
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUpdateUserRequest'
      responses:
        '200':
          description: The updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserResponse'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing, invalid or expired access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The signed-in user is not staff
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: cannot_change_self, or cannot_remove_last_admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Database error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/stats:
    get:
      summary: Dashboard numbers
      description: Staff only. Users, events, bookings, revenue and the top 5 events.
      operationId: getStats
      tags:
        - Admin
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The stats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminStatsResponse'
        '401':
          description: Missing, invalid or expired access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The signed-in user is not staff
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Database error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /newsletter/subscribe:
    post:
      summary: Subscribe to the newsletter
      description: Public (guests and signed-in users). A signed-in user subscribing their own account email gets the subscription linked to their account. No confirmation email is sent. Always answers the same way, so it cannot be used to discover who is subscribed.
      operationId: subscribeNewsletter
      tags:
        - Newsletter
      security:
        - {}
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscribeRequest'
      responses:
        '200':
          description: Subscribed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Enter a valid email address
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: A token was sent but it is invalid or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Database error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /me/newsletter:
    get:
      summary: Newsletter status of the signed-in user
      operationId: getMyNewsletter
      tags:
        - Newsletter
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The account email and whether it is subscribed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewsletterStatus'
        '401':
          description: Missing, invalid or expired access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Account is suspended or deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Database error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Unsubscribe the signed-in user
      description: Unsubscribes the caller's own address.
      operationId: unsubscribeNewsletter
      tags:
        - Newsletter
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Unsubscribed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnsubscribedResponse'
        '401':
          description: Missing, invalid or expired access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Account is suspended or deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Database error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/newsletter:
    get:
      summary: List newsletter subscribers
      description: Staff only. Newest first.
      operationId: listSubscribers
      tags:
        - Newsletter
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          schema:
            type: string
            maxLength: 100
          description: Email contains this text
        - name: status
          in: query
          schema:
            type: string
            enum:
              - subscribed
              - unsubscribed
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Page size
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
          description: How many rows to skip
      responses:
        '200':
          description: A page of subscribers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewsletterListResponse'
        '400':
          description: Invalid query parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing, invalid or expired access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The signed-in user is not staff
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Database error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /search:
    get:
      summary: Search the catalogue
      description: Public. Events, collections, collection items, locations and categories whose name or description contain the text (up to limit of each kind, best matches first). Guests never see drafts. A signed-in user's search is also saved to their history, which feeds the recommendations.
      operationId: searchCatalogue
      tags:
        - Search
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: true
          description: The text to search for
          schema:
            type: string
            minLength: 2
            maxLength: 100
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 5
          description: Maximum results of each kind
      responses:
        '200':
          description: Matches grouped by kind
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          description: Search text must be 2 to 100 characters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: A token was sent but it is invalid or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Database error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: The access_token returned by sign-in or sign-up
  schemas:
    CategoryRef:
      type: object
      required: [category_id, name]
      properties:
        category_id:
          type: string
          format: uuid
        name:
          type: string
    Category:
      type: object
      required: [category_id, name, description, parent_category_id, active]
      properties:
        category_id:
          type: string
          format: uuid
        name:
          type: string
          example: Mining & Industry
        description:
          type: string
          nullable: true
        parent_category_id:
          type: string
          format: uuid
          nullable: true
          description: null for a top-level category
        active:
          type: boolean
          description: Always true for non-staff callers
    CategoryListResponse:
      type: object
      required: [categories]
      properties:
        categories:
          type: array
          items:
            $ref: '#/components/schemas/Category'
    PickedCategory:
      type: object
      required: [category_id, name, description, parent_category_id]
      properties:
        category_id:
          type: string
          format: uuid
        name:
          type: string
          example: Mining & Industry
        description:
          type: string
          nullable: true
        parent_category_id:
          type: string
          format: uuid
          nullable: true
    PreferencesResponse:
      type: object
      required: [categories, onboarding_completed]
      properties:
        categories:
          type: array
          items:
            $ref: '#/components/schemas/PickedCategory'
        onboarding_completed:
          type: boolean
    UpdatePreferencesRequest:
      type: object
      required: [category_ids]
      additionalProperties: false
      properties:
        category_ids:
          type: array
          minItems: 1
          maxItems: 20
          description: Replaces the user's whole set of picks
          items:
            type: string
            format: uuid
          example:
            - 22222222-2222-2222-2222-222222222201
            - 22222222-2222-2222-2222-222222222203
    CollectionRef:
      type: object
      required: [collection_id, name]
      properties:
        collection_id:
          type: string
          format: uuid
        name:
          type: string
    Event:
      type: object
      required: [event_id, name, start_at, end_at, status, display_status, ticket_price, capacity, created_at, updated_at, location, categories, collections, event_type, price_member, price_child, cancellation_reason]
      properties:
        event_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
        status:
          type: string
          enum: [draft, scheduled, cancelled]
          description: The stored status. See display_status for the derived "completed" label.
        display_status:
          type: string
          enum: [draft, scheduled, cancelled, completed]
          description: >-
            status, except a scheduled event whose end_at has passed reads as
            completed. Derived at read time — never stored, so it's never out
            of date and the frontend never has to invent a fourth status itself.
        event_type:
          type: string
          nullable: true
          description: 'Free-text category, e.g. exhibition, workshop, lecture, tour, performance, other.'
        ticket_price:
          type: number
          description: 0 means a free event. The general-admission price.
        price_member:
          type: number
          nullable: true
          description: Member ticket price. Null = this tier isn't offered for this event.
        price_child:
          type: number
          nullable: true
          description: Child ticket price. Null = this tier isn't offered for this event.
        capacity:
          type: integer
        cancellation_reason:
          type: string
          nullable: true
        location_id:
          type: string
          format: uuid
          nullable: true
        location:
          $ref: '#/components/schemas/LocationRef'
        categories:
          type: array
          items:
            $ref: '#/components/schemas/CategoryRef'
        collections:
          type: array
          description: Collections the event showcases (only those the caller may see)
          items:
            $ref: '#/components/schemas/CollectionRef'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    EventResponse:
      type: object
      required: [event]
      properties:
        event:
          $ref: '#/components/schemas/Event'
    EventListResponse:
      type: object
      required: [events, total, limit, offset]
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/Event'
        total:
          type: integer
          description: How many events match, ignoring limit and offset
        limit:
          type: integer
        offset:
          type: integer
    CreateEventRequest:
      type: object
      required: [name, start_at, end_at, capacity, category_ids]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          example: Gold Rush Weekend
        description:
          type: string
          maxLength: 5000
          nullable: true
        start_at:
          type: string
          format: date-time
          description: ISO 8601 with a timezone offset
          example: '2026-11-14T10:00:00+10:30'
        end_at:
          type: string
          format: date-time
          description: Must be after start_at
          example: '2026-11-14T16:00:00+10:30'
        status:
          type: string
          enum: [draft, scheduled]
          default: draft
        location_id:
          type: string
          format: uuid
          nullable: true
        event_type:
          type: string
          maxLength: 100
          nullable: true
        ticket_price:
          type: number
          minimum: 0
          default: 0
        price_member:
          type: number
          minimum: 0
          nullable: true
        price_child:
          type: number
          minimum: 0
          nullable: true
        capacity:
          type: integer
          minimum: 0
        category_ids:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: string
            format: uuid
        collection_ids:
          type: array
          maxItems: 20
          default: []
          items:
            type: string
            format: uuid
    UpdateEventRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      description: Send only the fields to change.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 5000
          nullable: true
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
        status:
          type: string
          enum: [draft, scheduled, cancelled]
        location_id:
          type: string
          format: uuid
          nullable: true
        event_type:
          type: string
          maxLength: 100
          nullable: true
        ticket_price:
          type: number
          minimum: 0
        price_member:
          type: number
          minimum: 0
          nullable: true
        price_child:
          type: number
          minimum: 0
          nullable: true
        capacity:
          type: integer
          minimum: 0
        cancellation_reason:
          type: string
          maxLength: 2000
          nullable: true
        category_ids:
          type: array
          minItems: 1
          maxItems: 20
          description: Replaces the whole category list
          items:
            type: string
            format: uuid
        collection_ids:
          type: array
          maxItems: 20
          description: Replaces the whole collection list
          items:
            type: string
            format: uuid
    UpdateEventResponse:
      type: object
      required: [event]
      description: >-
        Used for PATCH /events/{id}. affected_bookings is present only when
        this call set status to cancelled, and reports how many pending or
        confirmed bookings were just cancelled (and, if paid, refunded).
      properties:
        event:
          $ref: '#/components/schemas/Event'
        affected_bookings:
          type: integer
          description: Only present when this PATCH cancelled the event.
    CancelEventResponse:
      type: object
      required: [event, affected_bookings]
      properties:
        event:
          $ref: '#/components/schemas/Event'
        affected_bookings:
          type: integer
          description: How many pending/confirmed bookings were just cancelled (and, if paid, refunded). 0 if the event was already cancelled.
    Recommendation:
      type: object
      required: [source, reasons]
      properties:
        source:
          type: string
          enum: [interest, history, popular, upcoming, featured, other]
          description: >-
            interest = matches the user's picks; history = matches what the user
            viewed, browsed, searched or booked recently; popular = booked most
            (events) or viewed most (collections), shown to everyone; upcoming =
            soonest events; featured = featured collection; other = remaining collections
        reasons:
          type: array
          description: >-
            The user's picks this item matches (empty unless source is
            interest), e.g. for "Because you like Mining & Industry"
          items:
            $ref: '#/components/schemas/CategoryRef'
    RecommendedEvent:
      allOf:
        - $ref: '#/components/schemas/Event'
        - type: object
          required: [recommendation]
          properties:
            recommendation:
              $ref: '#/components/schemas/Recommendation'
    RecommendedCollection:
      allOf:
        - $ref: '#/components/schemas/Collection'
        - type: object
          required: [recommendation]
          properties:
            recommendation:
              $ref: '#/components/schemas/Recommendation'
    RecommendationsResponse:
      type: object
      required: [personalised, interests, events, collections]
      properties:
        personalised:
          type: boolean
          description: true when the caller has interest picks the lists were ranked by
        interests:
          type: array
          description: The caller's picks (empty for guests)
          items:
            $ref: '#/components/schemas/CategoryRef'
        events:
          type: array
          items:
            $ref: '#/components/schemas/RecommendedEvent'
        collections:
          type: array
          items:
            $ref: '#/components/schemas/RecommendedCollection'
    LocationRef:
      type: object
      nullable: true
      required: [name, city]
      properties:
        name:
          type: string
        city:
          type: string
          nullable: true
    Collection:
      type: object
      required: [collection_id, name, status, featured, created_at, updated_at, location, categories, historical_period, catalogue_total]
      properties:
        collection_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        status:
          type: string
          enum: [draft, published, archived]
        featured:
          type: boolean
        location_id:
          type: string
          format: uuid
          nullable: true
        location:
          $ref: '#/components/schemas/LocationRef'
        categories:
          type: array
          items:
            $ref: '#/components/schemas/CategoryRef'
        historical_period:
          type: string
          nullable: true
          description: Free-text period label, e.g. "1850s-1900s"
        catalogue_total:
          type: integer
          nullable: true
          minimum: 0
          description: >-
            Full physical object count, including objects never individually
            digitised. Independent of (and not derived from) collection_items.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CollectionResponse:
      type: object
      required: [collection]
      properties:
        collection:
          $ref: '#/components/schemas/Collection'
    CollectionListResponse:
      type: object
      required: [collections, total, limit, offset]
      properties:
        collections:
          type: array
          items:
            $ref: '#/components/schemas/Collection'
        total:
          type: integer
          description: How many collections match, ignoring limit and offset
        limit:
          type: integer
        offset:
          type: integer
    CreateCollectionRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          example: Roman Coins
        description:
          type: string
          maxLength: 5000
          nullable: true
        status:
          type: string
          enum: [draft, published, archived]
          default: draft
        location_id:
          type: string
          format: uuid
          nullable: true
        featured:
          type: boolean
          default: false
        historical_period:
          type: string
          maxLength: 150
          nullable: true
        catalogue_total:
          type: integer
          minimum: 0
          nullable: true
        category_ids:
          type: array
          maxItems: 20
          items:
            type: string
            format: uuid
    UpdateCollectionRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      description: Send only the fields to change.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 5000
          nullable: true
        status:
          type: string
          enum: [draft, published, archived]
        location_id:
          type: string
          format: uuid
          nullable: true
        featured:
          type: boolean
        historical_period:
          type: string
          maxLength: 150
          nullable: true
        catalogue_total:
          type: integer
          minimum: 0
          nullable: true
        category_ids:
          type: array
          maxItems: 20
          description: Replaces the whole category list
          items:
            type: string
            format: uuid
    CategoriesError:
      type: object
      required: [code, message]
      description: Present only when syncing a collection's categories failed after its other fields already saved.
      properties:
        code:
          type: string
          enum: [invalid_category, server_error]
        message:
          type: string
    UpdateCollectionResponse:
      type: object
      required: [collection]
      description: >-
        Used for PATCH /collections/{id}. categories_error is present only on
        a 207 response, where it means the collection's fields saved but
        category_ids did not — resend category_ids alone to retry.
      properties:
        collection:
          $ref: '#/components/schemas/Collection'
        categories_error:
