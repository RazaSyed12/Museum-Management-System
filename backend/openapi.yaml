openapi: 3.0.3
info:
  title: Museum Visitor Experience Platform API
  version: "1.0"
paths:
  /auth/sign-up:
    post:
      summary: Create a new visitor account
      operationId: signUp
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignUpResponse'
        '400':
          description: Validation failed, or Supabase rejected the sign-up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: An account with that email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    SignUpRequest:
      type: object
      required: [full_name, email, password]
      additionalProperties: false
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 100
          example: Amara Okafor
        email:
          type: string
          format: email
          example: amara@example.com
        password:
          type: string
          minLength: 10
          format: password
          description: Must match supabase/config.toml's auth.minimum_password_length
    SignUpResponse:
      type: object
      required: [user, session]
      properties:
        user:
          type: object
          required: [id, email, full_name]
          properties:
            id:
              type: string
              format: uuid
            email:
              type: string
              format: email
            full_name:
              type: string
        session:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Session'
          description: >-
            null when email confirmation is required and the account
            isn't usable yet
    Session:
      type: object
      required: [access_token, refresh_token, expires_at]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_at:
          type: integer
          description: Unix timestamp (seconds) the access token expires at
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message]
          properties:
            message:
              type: string
            code:
              type: string
              enum: [validation_error, sign_up_failed, email_exists]