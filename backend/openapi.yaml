          type: string
          minLength: 1
          maxLength: 30
          description: Payment method label, e.g. card
        simulate:
          type: string
          enum:
            - success
            - card_declined
            - insufficient_funds
            - provider_error
          description: 'Simulated provider only: which outcome to simulate (default success)'
        confirm:
          type: boolean
          description: 'Simulated provider only: false = start the payment but confirm later with POST /payments/{id}/confirm'
      additionalProperties: false
    ConfirmPaymentRequest:
      type: object
      properties:
        simulate:
          type: string
          enum:
            - success
            - card_declined
