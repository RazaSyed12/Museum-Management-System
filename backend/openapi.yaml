        '401':
          description: Missing, invalid or expired access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '402':
          description: The payment failed (code card_declined, insufficient_funds, provider_error or payment_failed). The booking or membership stays pending and the customer can try again until the 15 minutes run out.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentFailureResponse'
        '403':
          description: Account is suspended or deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such payment, or it belongs to someone else
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 'booking_closed or membership_closed: the window ran out before the payment arrived, so the payment is being refunded'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentFailureResponse'
        '500':
