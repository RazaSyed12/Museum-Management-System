          type: string
        event_start_at:
          type: string
          format: date-time
        unit_price:
          type: number
        quantity:
          type: integer
        subtotal:
          type: number
        discount_percent:
          type: number
          description: Member discount applied (0 for non-members)
        discount_amount:
          type: number
        tax_amount:
          type: number
          description: 10% of the discounted amount
        service_fee:
          type: number
          description: 2% of the discounted amount
        total_amount:
          type: number
        is_member:
          type: boolean
        available:
          type: integer
          description: Tickets still available in this allocation
        hold_minutes:
          type: integer
          example: 15
          description: How long a booking holds the seats before payment
