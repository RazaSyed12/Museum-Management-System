          $ref: '#/components/schemas/Quote'
    NextAction:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - none
            - confirm
            - redirect
          description: none = finished; confirm = call POST /payments/{id}/confirm (the simulation); redirect = send the customer to url (e.g. the PayPal approval page), then confirm
        confirm_url:
          type: string
          description: Present when type is confirm
        url:
          type: string
          description: Present when type is redirect
    PayRequest:
      type: object
      properties:
        method:
          type: string
          minLength: 1
          maxLength: 30
          description: Payment method label, e.g. card
        simulate:
          type: string
          enum:
            - success
            - card_declined
            - insufficient_funds
            - provider_error
          description: 'Simulated provider only: which outcome to simulate (default success)'
        confirm:
          type: boolean
          description: 'Simulated provider only: false = start the payment but confirm later with POST /payments/{id}/confirm'
      additionalProperties: false
    PurchaseMembershipRequest:
      type: object
      required:
