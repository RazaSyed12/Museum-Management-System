openapi: 3.0.3
info:
  title: Museum Visitor Experience Platform API
  version: "1.0"
servers:
  - url: http://127.0.0.1:4000
    description: Local development
security: []
paths:
  /auth/sign-up:
    post:
      summary: Create a new visitor account
      operationId: signUp
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignUpResponse'
        '400':
          description: Validation failed, or Supabase rejected the sign-up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: An account with that email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/sign-in:
    post:
      summary: Sign in with email and password
      operationId: signIn
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInResponse'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Incorrect email or password (same answer for unknown email and wrong password)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Account is suspended or deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/forgot-password:
    post:
      summary: Email a password reset link
      description: >-
        Always answers 200 with the same message, whether or not the
        email has an account, so it can't be used to discover who is registered.
      operationId: forgotPassword
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: Request accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Too many reset emails requested; wait and retry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/reset-password:
    post:
      summary: Set a new password using the token from the reset email
      description: >-
        The reset email link opens the frontend with
        `#access_token=...&type=recovery`. The frontend sends that
        access_token here together with the new password.
      operationId: resetPassword
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Validation failed, or the new password was rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Reset token is invalid or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/me:
    get:
      summary: Get the signed-in user's profile
      operationId: getMe
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The caller's profile
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: '#/components/schemas/AuthUser'
        '401':
          description: Missing, invalid or expired access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Account is suspended or deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /staff/me:
    get:
      summary: Get my staff profile
      description: >-
        Any signed-in, active account (not staff-only), so a non-staff or
        not-yet-tiered caller gets a specific, actionable reason rather than
        a generic 403. Returns the caller's own id, email, name, phone,
        general role, Admin/Manager/Staff tier, account status and last login.
      operationId: getStaffMe
      tags: [Staff]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The caller's staff profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffProfileResponse'
        '401':
          description: Missing, invalid or expired access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: >-
            The account is not staff (code not_staff), or is staff but has
            not been assigned a tier yet (code tier_not_assigned) — ask an
            admin to set one.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Database error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/refresh:
    post:
      summary: Swap a refresh token for a new session
      description: >-
        Call this when the access token expires. The response contains a new
        access token AND a new refresh token; the old refresh token stops
        working, so the frontend must save the new one every time.
        A login lasts at most 30 days from the moment of sign-in: refreshing
        does not extend it, and after 30 days this answers 401 session_expired
        and the user must sign in again.
      operationId: refreshSession
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: New session issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: >-
            Refresh token is invalid, expired or already signed out
            (code invalid_refresh_token), or the login is older than 30 days
            (code session_expired). In both cases the user must sign in again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: >-
            The account was suspended or deleted since the user signed in
            (code account_inactive). No new session is issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/sign-out:
    post:
      summary: End the current session
      description: >-
        Revokes this session on the server so its refresh token stops working.
        Needs a still-valid access token; if it has expired, call
        /auth/refresh first.
      operationId: signOut
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Signed out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Missing, invalid or expired access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /me/preferences:
    get:
      summary: Get the signed-in user's interest picks
      description: >-
        The categories the user picked on the onboarding page (or edited
        later). Picks whose category has since been deactivated are left out.
      operationId: getMyPreferences
      tags: [Preferences]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The user's active picks, sorted by name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreferencesResponse'
        '401':
          description: Missing, invalid or expired access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Account is suspended or deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Database error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Save the signed-in user's interest picks
      description: >-
        Called by the onboarding page's Continue button and by the Account
        page's interests editor. The list sent replaces the user's whole set.
        At least one category is required (onboarding can't be skipped);
        every id must be an active category. Duplicate ids are ignored.
      operationId: updateMyPreferences
      tags: [Preferences]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePreferencesRequest'
      responses:
        '200':
          description: Saved. Same shape as GET; onboarding_completed is true.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreferencesResponse'
        '400':
          description: >-
            validation_error (empty list, bad UUID, more than 20) or
            invalid_category (unknown or deactivated category)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing, invalid or expired access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Account is suspended or deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Database error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /categories:
    get:
      summary: List categories
      description: >-
        Public. Feeds the onboarding interest picker, category filters and
        staff forms. Without a token (or with a non-staff token) only active
        categories are returned. With a staff token, deactivated categories
        are included too. Always the full list, sorted by name (no paging).
      operationId: listCategories
      tags: [Categories]
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: top_level
          in: query
          description: >-
            true = only categories with no parent (what the onboarding page
            shows); false = only sub-categories; omit for all.
          schema:
            type: string
            enum: ['true', 'false']
      responses:
        '200':
          description: Categories, ordered by name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryListResponse'
        '400':
          description: Invalid query parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: A token was sent but it is invalid or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Database error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Create a category
      description: Staff only.
      operationId: createCategory
      tags:
        - Categories
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryRequest'
      responses:
        '201':
          description: Category created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '400':
          description: Validation failed, or the parent category does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing, invalid or expired access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The signed-in user is not staff
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: A category with that name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Database error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /collections:
    get:
      summary: List collections
      description: >-
        Public. Without a token only published collections are returned.
        With a staff token, drafts and archived collections are included too.
      operationId: listCollections
      tags: [Collections]
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          description: Only collections whose name contains this text (case-insensitive)
          schema:
            type: string
            maxLength: 100
        - name: featured
          in: query
          description: Only featured (true) or non-featured (false) collections
          schema:
            type: string
            enum: ['true', 'false']
        - name: status
          in: query
          description: >-
            Only collections with this status. Narrows within whatever
            row-level security already allows — a guest asking for
            status=draft simply gets zero rows, not an error.
          schema:
            type: string
            enum: [draft, published, archived]
        - name: category_id
          in: query
          description: >-
            Only collections tagged with this category OR one of that
            category's direct sub-categories.
          schema:
            type: string
            format: uuid
        - name: sort
          in: query
          description: Sort order. Defaults to name (the original, unchanged behaviour).
          schema:
            type: string
            enum: [name, newest, oldest, updated]
            default: name
        - name: limit
          in: query
          description: Page size
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          description: How many collections to skip
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: A page of collections, ordered per the sort parameter (name by default)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionListResponse'
        '400':
          description: Invalid query parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: A token was sent but it is invalid or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Database error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Create a collection
      description: Staff only. New collections default to the draft status.
      operationId: createCollection
      tags: [Collections]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCollectionRequest'
      responses:
        '201':
          description: Collection created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionResponse'
        '400':
          description: Validation failed, or an unknown location or category was given
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing, invalid or expired access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The signed-in user is not staff
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Database error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /collections/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The collection's id
        schema:
          type: string
          format: uuid
    get:
      summary: Get one collection
      description: >-
        Public for published collections. A draft or archived collection
        looks like a missing one (404) unless the caller is staff.
      operationId: getCollection
      tags: [Collections]
      security:
        - {}
        - bearerAuth: []
      responses:
        '200':
          description: The collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionResponse'
        '400':
          description: The id is not a valid UUID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: A token was sent but it is invalid or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such collection, or it is not visible to the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Database error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      summary: Edit a collection
      description: >-
        Staff only. Only the fields that are sent are changed. If
        category_ids is sent, it replaces the collection's category list.
        Setting status to archived requires an admin or manager tier.
        The row update and the category-link update are separate writes;
        if the row saves but syncing categories fails, the response is
        207 (not an error) with categories_error describing what to
        retry — the collection's other fields are not rolled back.
      operationId: updateCollection
      tags: [Collections]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCollectionRequest'
      responses:
        '200':
          description: The updated collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateCollectionResponse'
        '207':
          description: >-
            The collection's fields saved, but updating its categories
            failed — see categories_error. Resend PATCH with just
            category_ids to retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateCollectionResponse'
        '400':
          description: Validation failed, or an unknown location or category was given
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing, invalid or expired access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: >-
            The signed-in user is not staff, or is staff but setting
            status to archived without an admin or manager tier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Database error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /collections/{id}/archive:
    parameters:
      - name: id
        in: path
        required: true
        description: The collection's id
        schema:
          type: string
          format: uuid
    post:
      summary: Archive a collection
      description: >-
        Admin or manager tier only. Hides the collection from the public site
        but keeps it in the database. Calling it again on an archived
        collection changes nothing.
      operationId: archiveCollection
      tags: [Collections]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The archived collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionResponse'
        '400':
          description: The id is not a valid UUID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing, invalid or expired access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The signed-in user is not staff, or lacks an admin/manager tier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Database error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /events:
    get:
      summary: List events
      description: >-
        Public. Without a token, draft events are hidden (scheduled and
        cancelled ones are shown). With a staff token, drafts are included.
      operationId: listEvents
      tags: [Events]
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: when
          in: query
          description: >-
            upcoming = hasn't ended yet, soonest first (default);
            past = already ended, most recent first; all = everything, soonest first
          schema:
            type: string
            enum: [upcoming, past, all]
            default: upcoming
        - name: q
          in: query
          description: Only events whose name contains this text (case-insensitive)
          schema:
            type: string
            maxLength: 100
        - name: category_id
          in: query
          description: Only events in this category or one of its sub-categories
          schema:
            type: string
            format: uuid
        - name: collection_id
          in: query
          description: Only events that showcase this collection
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          description: Only events with this status (draft is only visible to staff)
          schema:
            type: string
            enum: [draft, scheduled, cancelled]
        - name: type
          in: query
          description: Only events with this event_type
          schema:
            type: string
            maxLength: 100
        - name: date_from
          in: query
          description: >-
            Only events whose [start_at, end_at] range overlaps this window.
            Independent of `when`; combine the two at your own risk (both apply).
          schema:
            type: string
            format: date-time
        - name: date_to
          in: query
          description: The other end of the overlap window described by date_from
          schema:
            type: string
            format: date-time
        - name: sort
          in: query
          description: >-
            start_at (default) keeps the existing when-based direction
            (soonest first for upcoming/all, most recent first for past).
            newest/oldest instead sort by when the event was created.
          schema:
            type: string
            enum: [start_at, newest, oldest]
            default: start_at
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: A page of events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventListResponse'
        '400':
          description: Invalid query parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: A token was sent but it is invalid or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Database error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Create an event
      description: >-
        Staff only. At least one category is required (recommendations match
        users' interests against event categories). New events default to
        draft, which is hidden from the public.
      operationId: createEvent
      tags: [Events]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventRequest'
      responses:
        '201':
          description: Event created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '400':
          description: >-
            validation_error (bad field, end not after start, unknown location
            or collection) or invalid_category (unknown or deactivated category)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing, invalid or expired access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Not a staff account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Database error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /events/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Get one event
      description: Public. A draft event returns 404 to anyone who isn't staff.
      operationId: getEvent
      tags: [Events]
      security:
        - {}
        - bearerAuth: []
      responses:
        '200':
          description: The event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '400':
          description: id is not a valid UUID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: A token was sent but it is invalid or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such event, or it is a draft and the caller isn't staff
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      summary: Update an event
      description: >-
        Staff only. Changes only the fields sent. category_ids and
        collection_ids, if sent, replace the whole list (category_ids still
        needs at least one). Lowering the capacity below the tickets already
        allocated to the event is refused (400). Setting status to cancelled
        requires an admin or manager tier, persists cancellation_reason if
        sent, and triggers the same cascade described under
        POST /events/{id}/cancel — the response's affected_bookings then
        reports how many bookings that was.
      operationId: updateEvent
      tags: [Events]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEventRequest'
      responses:
        '200':
          description: Event updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateEventResponse'
        '400':
          description: validation_error or invalid_category
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing, invalid or expired access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: >-
            The signed-in user is not staff, or is staff but setting status
            to cancelled without an admin or manager tier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Event not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /events/{id}/cancel:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      summary: Cancel an event
      description: >-
        Admin or manager tier only. Sets status to cancelled; the event stays
        visible to the public, marked cancelled. Repeating it is harmless (and
        reports affected_bookings: 0 the second time). An optional reason is
        persisted as cancellation_reason — sending none leaves an existing
        reason untouched. Every pending or confirmed booking for the event is
        cancelled at the same time, the seats are released and paid bookings
        are refunded (the same happens if the status is changed to cancelled
        with PATCH); affected_bookings reports how many that was.
      operationId: cancelEvent
      tags: [Events]
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason:
                  type: string
                  maxLength: 2000
                  nullable: true
      responses:
        '200':
          description: Event cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelEventResponse'
        '401':
          description: Missing, invalid or expired access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The signed-in user is not staff, or lacks an admin/manager tier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Event not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /recommendations:
    get:
      summary: Recommended events and collections
      description: >-
        Public. Feeds the "Recommended for you" row on the Home page; it does
        not restrict browsing (GET /events and GET /collections still list
        everything). Signed in with interest picks: items matching the picks
        (including their sub-categories) come first, most matches first, then
        the list is topped up with other items. Guests and users without
        picks get the same list without the personal part. Only scheduled,
        not-yet-ended events and published collections are recommended.
        Ranking: each interest pick an item matches counts for 10 points; a
        signed-in user's history (last 90 days) adds at most 9 more, so a
        pick always beats behaviour; ties go to the more popular item.
        Guests are never tracked, but still see the popular items.
      operationId: getRecommendations
      tags: [Recommendations]
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          description: Maximum number of events, and separately of collections
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 6
      responses:
        '200':
          description: Recommended events and collections
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationsResponse'
        '400':
          description: Invalid query parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: A token was sent but it is invalid or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Database error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
