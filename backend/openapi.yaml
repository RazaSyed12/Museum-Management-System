  /bookings/{id}/pay:
    post:
      summary: Pay for a booking
      description: 'Starts a payment for the caller''s pending booking. With the simulated provider the payment is confirmed straight away (add {"confirm": false} to stop after starting it and finish later with POST /payments/{id}/confirm; add {"simulate": "card_declined"}, "insufficient_funds" or "provider_error" to simulate a failure). With a real provider such as PayPal the reply carries next_action (for example a redirect to the approval page) and our server settles the payment when the provider answers. Safe to repeat: an unfinished payment attempt is reused. A failed attempt keeps the booking pending, so the customer can retry until the 15-minute hold ends.'
      operationId: payBooking
      tags:
        - Payments
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The booking's id
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayRequest'
      responses:
        '200':
          description: Paid; the booking is confirmed and the tickets have codes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentOutcomeResponse'
        '202':
          description: The payment was started but is not settled yet; follow next_action
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentPendingResponse'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing, invalid or expired access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '402':
          description: The payment failed (code card_declined, insufficient_funds, provider_error or payment_failed). The booking or membership stays pending and the customer can try again until the 15 minutes run out.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentFailureResponse'
        '403':
          description: forbidden (account not active) or simulation_disabled (simulated payments are switched off)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No such booking, or it belongs to someone else
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: already_paid; booking_closed (the booking was cancelled or expired, or the hold ran out before the payment arrived, in which case the payment is being refunded); or hold_expired (the hold ran out, the booking was released)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentFailureResponse'
        '500':
          description: Database error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: 'provider_unavailable: the payment provider could not be reached; try again'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /payments/{id}/confirm:
    post:
      summary: Finish a payment
      description: 'The owner. Finishes a payment that was started with {"confirm": false}, or (with a real provider) after the customer comes back from the provider. Confirming a payment that is already settled changes nothing and answers 200 with already_settled: true. If the money arrives after the booking or membership window has closed, the payment is refunded instead.'
      operationId: confirmPayment
      tags:
        - Payments
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The payment's id
