<!-- @dsCard group="Components" viewport="700x380" name="Form controls" subtitle="Labelled fields, select, search, checkbox, radio, stepper, upload" -->
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--surface-page);font:var(--type-body)}.wrap{padding:20px;display:flex;flex-direction:column;gap:16px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.lbl{font:var(--weight-semibold) 10px/1 var(--font-body);letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted)}</style>
<div id="root"></div>
<script type="text/babel">
const { Field, Input, Select, SearchField, Checkbox, RadioGroup, QuantityStepper, DateTimeField, Textarea } = window.HeritageMuseumDesignSystem_5a5154;
function Demo(){
  const [q,setQ]=React.useState('bronze');const [n,setN]=React.useState(2);const [r,setR]=React.useState('Published');const [c,setC]=React.useState(true);
  return(<div className="wrap" style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:20}}>
    <Field label="Email address" htmlFor="e1" hint="Booking confirmations are sent here."><Input id="e1" placeholder="you@example.com" iconLeft="mail" /></Field>
    <Field label="Card number" htmlFor="e2" error="Enter a 16-digit card number" required><Input id="e2" invalid defaultValue="4242 4242" /></Field>
    <Field label="Historical period" htmlFor="e3"><Select id="e3" placeholder="All periods" options={['Prehistory','Medieval','Renaissance']} /></Field>
    <Field label="Start date" htmlFor="e4"><DateTimeField id="e4" type="date" defaultValue="2026-09-14" /></Field>
    <Field label="Search" htmlFor="s1"><SearchField id="s1" value={q} onChange={e=>setQ(e.target.value)} onClear={()=>setQ('')} /></Field>
    <div style={{display:'grid',gap:8}}>
      <Checkbox id="c1" checked={c} onChange={()=>setC(!c)} label="Email me what's on" description="Monthly exhibition news." />
      <RadioGroup name="st" legend="Status" value={r} onChange={setR} options={['Draft','Published','Archived']} direction="row" />
    </div>
    <div style={{display:'grid',gap:8}}><span className="lbl">Quantity</span><QuantityStepper label="General admission" value={n} onChange={setN} max={6} /></div>
    <Field label="Description" htmlFor="t1"><Textarea id="t1" rows={3} defaultValue="Fossils from the Jurassic." /></Field>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
