<!-- @dsCard group="Colors" viewport="700x160" name="Status colours" subtitle="Muted, heritage-toned status pairs — always paired with an icon and a word" -->
<meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;background:var(--surface-page)}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{display:grid;gap:6px}.chip{height:56px;border-radius:var(--radius-md);border:1px solid rgba(20,35,26,.08)}.n{font:var(--weight-semibold) 11px/1.3 var(--font-body);color:var(--text-heading)}.v{font:400 11px/1.3 var(--font-mono);color:var(--text-muted)}</style>
<div class="g"><div class="sw" style="width:150px"><div class="chip" style="background:#DEEEE2;display:grid;place-items:center"><span style="font:var(--weight-semibold) 12px/1 var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:#3E7D4F">Success</span></div><span class="v">#3E7D4F on #DEEEE2</span></div><div class="sw" style="width:150px"><div class="chip" style="background:#FAEDD1;display:grid;place-items:center"><span style="font:var(--weight-semibold) 12px/1 var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:#B4801B">Warning</span></div><span class="v">#B4801B on #FAEDD1</span></div><div class="sw" style="width:150px"><div class="chip" style="background:#F6E1DD;display:grid;place-items:center"><span style="font:var(--weight-semibold) 12px/1 var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:#A83A2B">Danger</span></div><span class="v">#A83A2B on #F6E1DD</span></div><div class="sw" style="width:150px"><div class="chip" style="background:#DCE8EF;display:grid;place-items:center"><span style="font:var(--weight-semibold) 12px/1 var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:#3A6076">Info</span></div><span class="v">#3A6076 on #DCE8EF</span></div></div>
