<!-- @dsCard group="Spacing" viewport="700x180" name="Focus & interaction states" subtitle="2px olive outline at 2px offset; hover lifts, press darkens" -->
<meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;background:var(--surface-page)}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{display:grid;gap:6px}.chip{height:56px;border-radius:var(--radius-md);border:1px solid rgba(20,35,26,.08)}.n{font:var(--weight-semibold) 11px/1.3 var(--font-body);color:var(--text-heading)}.v{font:400 11px/1.3 var(--font-mono);color:var(--text-muted)}</style>
<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">
<button style="min-height:44px;padding:0 20px;border-radius:var(--radius-md);border:1px solid var(--green-900);background:var(--green-900);color:var(--paper-50);font:var(--type-button)">Rest</button>
<button style="min-height:44px;padding:0 20px;border-radius:var(--radius-md);border:1px solid var(--green-700);background:var(--green-700);color:var(--paper-50);font:var(--type-button)">Hover</button>
<button style="min-height:44px;padding:0 20px;border-radius:var(--radius-md);border:1px solid var(--green-950);background:var(--green-950);color:var(--paper-50);font:var(--type-button)">Press</button>
<button style="min-height:44px;padding:0 20px;border-radius:var(--radius-md);border:1px solid var(--green-900);background:var(--green-900);color:var(--paper-50);font:var(--type-button);outline:2px solid var(--focus-ring);outline-offset:2px">Focus</button>
<button style="min-height:44px;padding:0 20px;border-radius:var(--radius-md);border:1px solid transparent;background:var(--action-disabled-bg);color:var(--action-disabled-text);font:var(--type-button)">Disabled</button>
<div style="display:grid;gap:4px"><div style="width:150px;height:44px;border-radius:var(--radius-md);border:1px solid var(--olive-500);box-shadow:var(--ring-focus);background:#fff"></div><span class="v">input · focus ring</span></div>
</div>
