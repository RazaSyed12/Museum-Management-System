<meta charset="utf-8"><link rel="stylesheet" href="../styles.css">

<div style="display:grid;gap:8px;font:var(--type-body-sm);color:var(--text-body)">
<div style="display:grid;grid-template-columns:150px 190px 1fr;gap:12px"><code style="font:400 12px var(--font-mono);color:var(--olive-700)">--duration-fast</code><code style="font:400 12px var(--font-mono);color:var(--text-muted)">140ms</code><span style="color:var(--text-muted)">colour, border, shadow on controls</span></div><div style="display:grid;grid-template-columns:150px 190px 1fr;gap:12px"><code style="font:400 12px var(--font-mono);color:var(--olive-700)">--duration-base</code><code style="font:400 12px var(--font-mono);color:var(--text-muted)">220ms</code><span style="color:var(--text-muted)">card lift, drawer and modal entry</span></div><div style="display:grid;grid-template-columns:150px 190px 1fr;gap:12px"><code style="font:400 12px var(--font-mono);color:var(--olive-700)">--duration-slow</code><code style="font:400 12px var(--font-mono);color:var(--text-muted)">360ms</code><span style="color:var(--text-muted)">hero and page-level transitions</span></div><div style="display:grid;grid-template-columns:150px 190px 1fr;gap:12px"><code style="font:400 12px var(--font-mono);color:var(--olive-700)">--ease-out</code><code style="font:400 12px var(--font-mono);color:var(--text-muted)">cubic-bezier(.16,1,.3,1)</code><span style="color:var(--text-muted)">the default curve for everything entering</span></div>
