<div style="display:flex;gap:14px;flex-wrap:wrap">
<div style="display:grid;gap:6px;justify-items:center"><div style="width:76px;height:52px;background:var(--olive-100);border:1px solid var(--olive-300);border-radius:var(--radius-sm)"></div><span class="v">sm 3px</span></div><div style="display:grid;gap:6px;justify-items:center"><div style="width:76px;height:52px;background:var(--olive-100);border:1px solid var(--olive-300);border-radius:var(--radius-md)"></div><span class="v">md 6px</span></div><div style="display:grid;gap:6px;justify-items:center"><div style="width:76px;height:52px;background:var(--olive-100);border:1px solid var(--olive-300);border-radius:var(--radius-lg)"></div><span class="v">lg 10px</span></div><div style="display:grid;gap:6px;justify-items:center"><div style="width:76px;height:52px;background:var(--olive-100);border:1px solid var(--olive-300);border-radius:var(--radius-xl)"></div><span class="v">xl 16px</span></div><div style="display:grid;gap:6px;justify-items:center"><div style="width:76px;height:52px;background:var(--olive-100);border:1px solid var(--olive-300);border-radius:var(--radius-pill)"></div><span class="v">pill</span></div>

<div style="display:flex;gap:14px;margin-top:16px;flex-wrap:wrap">
<div style="display:grid;gap:6px;justify-items:center"><div style="width:76px;height:52px;background:#fff;border-radius:var(--radius-lg);box-shadow:var(--shadow-xs)"></div><span class="v">shadow-xs</span></div><div style="display:grid;gap:6px;justify-items:center"><div style="width:76px;height:52px;background:#fff;border-radius:var(--radius-lg);box-shadow:var(--shadow-sm)"></div><span class="v">shadow-sm</span></div><div style="display:grid;gap:6px;justify-items:center"><div style="width:76px;height:52px;background:#fff;border-radius:var(--radius-lg);box-shadow:var(--shadow-md)"></div><span class="v">shadow-md</span></div><div style="display:grid;gap:6px;justify-items:center"><div style="width:76px;height:52px;background:#fff;border-radius:var(--radius-lg);box-shadow:var(--shadow-lg)"></div><span class="v">shadow-lg</span></div><div style="display:grid;gap:6px;justify-items:center"><div style="width:76px;height:52px;background:#fff;border-radius:var(--radius-lg);box-shadow:var(--shadow-xl)"></div><span class="v">shadow-xl</span></div>
