<body>
<doc-page margin="0.5in">
<div class="cover">
<span class="eyebrow">Heritage Museum · Design system</span>
<h1>Visitor website screens</h1>
<p>Every public-facing screen at 1440px, plus the 390px mobile layouts. Logged-out and personalised home states, the full ticketing flow, authentication, and membership. Desktop screens are reproduced at half scale.</p>
</div>
<div id="root"></div>
</doc-page>
<script src="../../doc-page.js"></script>
<script type="text/babel" src="Shell.jsx"></script>
<script type="text/babel" src="HomeScreen.jsx"></script>
<script type="text/babel" src="CollectionScreens.jsx"></script>
<script type="text/babel" src="EventScreens.jsx"></script>
<script type="text/babel" src="TicketingScreens.jsx"></script>
<script type="text/babel" src="AccountScreens.jsx"></script>
<script type="text/babel">
const noop = () => {};

function Shot({ title, meta, mode, children }) {
  return (
    <section className="shot">
      <h2>{title}</h2>
      <p className="meta">{meta}</p>
      <div className="viewport" style={{ width: mode === 'mobile' ? 390 : 720 }}>
        <div className={mode === 'mobile' ? 'w390' : 'w1440'}>{children}</div>
      </div>
    </section>
  );
}

function PrintDoc() {
  const anon = { user: undefined, isMember: false, go: noop, signIn: noop, signOut: noop, setMember: noop };
  const member = { user: { name: 'Amara Okafor', initials: 'AO' }, isMember: true, go: noop, signIn: noop, signOut: noop, setMember: noop };
  const orderMember = useOrder(true);
  const D = 'Desktop · 1440px';
  const M = 'Mobile · 390px';
  return (
    <>
      <Shot title="Home — signed out" meta={D + ' · anonymous visitor, popular content'}><HomeScreen mode="desktop" nav={anon} /></Shot>
      <Shot title="Home — signed in as a member" meta={D + ' · personalised recommendations, member benefits surfaced'}><HomeScreen mode="desktop" nav={member} /></Shot>
      <Shot title="Collections browse" meta={D + ' · sidebar filters, sort, three-column grid, pagination'}><CollectionsScreen mode="desktop" nav={anon} /></Shot>
      <Shot title="Collection detail" meta={D + ' · hero, metadata, objects, related events and collections'}><CollectionDetailScreen mode="desktop" nav={anon} /></Shot>
      <Shot title="Artefact detail" meta={D + ' · gallery, full object metadata, related objects'}><ItemDetailScreen mode="desktop" nav={anon} /></Shot>
      <Shot title="What's on" meta={D + ' · tabs, filters, availability states on every row'}><EventsScreen mode="desktop" nav={member} /></Shot>
      <Shot title="Event detail" meta={D + ' · sticky ticket rail, availability and cancellation states'}><EventDetailScreen mode="desktop" nav={member} /></Shot>
      <Shot title="Ticket selection" meta={D + ' · ticket types, member allocation, running order summary'}><TicketSelectScreen mode="desktop" nav={member} order={orderMember} /></Shot>
      <Shot title="Checkout" meta={D + ' · subtotal, service charge, VAT and member discount before payment'}><CheckoutScreen mode="desktop" nav={member} order={orderMember} /></Shot>
      <Shot title="Payment" meta={D + ' · prototype card form with success and failure states'}><PaymentScreen mode="desktop" nav={member} order={orderMember} /></Shot>
      <Shot title="Booking confirmation" meta={D + ' · reference, booking detail, placeholder QR ticket'}><ConfirmationScreen mode="desktop" nav={member} order={orderMember} /></Shot>
      <Shot title="Sign in" meta={D + ' · split layout, remember me, forgot password'}><SignInScreen mode="desktop" nav={anon} /></Shot>
      <Shot title="Create an account" meta={D + ' · states plainly that an account is not a membership'}><RegisterScreen mode="desktop" nav={anon} /></Shot>
      <Shot title="Interest onboarding" meta={D + ' · seeds the recommendation profile; skippable'}><InterestsScreen mode="desktop" nav={anon} /></Shot>
      <Shot title="Profile — bookings" meta={D + ' · membership status, booking history, interests, settings'}><ProfileScreen mode="desktop" nav={member} /></Shot>
      <Shot title="Membership" meta={D + ' · benefits, placeholder tiers, active-member state'}><MembershipScreen mode="desktop" nav={member} /></Shot>
      <Shot title="Home" meta={M + ' · hamburger nav, stacked hero, single-column rails'} mode="mobile"><HomeScreen mode="mobile" nav={anon} /></Shot>
      <Shot title="Collections browse" meta={M + ' · filter button opens a bottom drawer, single-column grid'} mode="mobile"><CollectionsScreen mode="mobile" nav={anon} /></Shot>
      <Shot title="What's on" meta={M + ' · scrollable tabs, vertical event cards'} mode="mobile"><EventsScreen mode="mobile" nav={member} /></Shot>
      <Shot title="Ticket selection" meta={M + ' · touch-friendly steppers, summary below the fold'} mode="mobile"><TicketSelectScreen mode="mobile" nav={member} order={orderMember} /></Shot>
      <Shot title="Checkout" meta={M + ' · single-column form, stacked order summary'} mode="mobile"><CheckoutScreen mode="mobile" nav={member} order={orderMember} /></Shot>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<PrintDoc />);
</script>
</body>
</html>
